spring:
  application:
    name: projeto-portifolio

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/portifolio}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true